server:
  port: 8601
spring:
  application:
    name: web-customer
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic


