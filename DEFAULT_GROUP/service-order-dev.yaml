server:
  port: 8505
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 查看日志
feign:
  sentinel:
    enabled: true
spring:
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1800000
      password:
      jedis:
        pool:
          max-active: 50  # 从 20 改成 50，和线程池核心数匹配
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 20    # 从 5 改成 20，保留更多空闲连接
          min-idle: 5     # 从 0 改成 5，避免频繁创建销毁连接
    mongodb:
      host: localhost
      port: 27017
      database: daijia #指定操作的数据库
  rabbitmq:
    host: 192.168.101.12
    port: 5672
    username: admin
    password: 123456
    publisher-confirm-type: CORRELATED
    publisher-returns: true
    listener:
      simple:
        cknowledge-mode: manual #默认情况下消息消费者是自动确认消息的，如果要手动确认消息则需要修改确认模式为manual
        prefetch: 1 # 消费者每次从队列获取的消息数量。此属性当不设置时为：轮询分发，设置为1为：公平分发
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/daijia_order?characterEncoding=utf-8&useSSL=false
    username: root
    password: admin
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: GuliHikariPool
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
seata:
  tx-service-group: daijia_tx_group
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      daijia_tx_group: default
    grouplist:
      default: 127.0.0.1:8091