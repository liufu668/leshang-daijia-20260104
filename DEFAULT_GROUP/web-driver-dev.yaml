server:
  port: 8602
feign:
  sentinel:
    enabled: true
spring:
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    openfeign:
      lazy-attributes-resolution: true #开启懒加载，否则启动报错
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000
            loggerLevel: basic
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 1800000
      password:
      jedis:
        pool:
          max-active: 50  # 从 20 改成 50，和线程池核心数匹配
          max-wait: -1    #最大阻塞等待时间(负数表示没限制)
          max-idle: 20    # 从 5 改成 20，保留更多空闲连接
          min-idle: 5     # 从 0 改成 5，避免频繁创建销毁连接
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB     #单个文件最大限制
      max-request-size: 20MB  #多个文件最大限制
seata:
  tx-service-group: daijia_tx_group
  enable-auto-data-source-proxy: false
  service:
    vgroup-mapping:
      daijia_tx_group: default
    grouplist:
      default: 127.0.0.1:8091