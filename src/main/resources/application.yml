spring:
  application:
    name: daijia-parent
  datasource:
    url: jdbc:mysql://localhost:3306/daijia_customer?serverTimezone=Asia/Shanghai
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8600

logging:
  level:
    com.project.login: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

wechat:
  app-id: ${WECHAT_APPID}
  app-secret: ${WECHAT_APP_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24
