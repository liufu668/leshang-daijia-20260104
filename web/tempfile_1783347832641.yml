# ==================== Spring Boot Actuator 配置 ====================
management:
  endpoints:
    web:
      exposure:
        # 暴露所有端点（生产环境建议只暴露需要的）
        include: health,info,metrics,prometheus,env,loggers,threaddump,heapdump
      base-path: /actuator
  
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  
  # JVM 指标
  jvm:
    metrics:
      export:
        prometheus:
          enabled: true
  
  # HTTP 请求指标
  web:
    server:
      request-metrics:
        enabled: true
  
  # 数据库连接池指标
  jdbc:
    metrics:
      export:
        prometheus:
          enabled: true
  
  # Redis 指标
  redis:
    metrics:
      export:
        prometheus:
          enabled: true
  
  # RabbitMQ 指标
  rabbit:
    metrics:
      export:
        prometheus:
          enabled: true

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.daijia: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
