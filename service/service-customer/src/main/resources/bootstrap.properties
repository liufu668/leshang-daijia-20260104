spring.application.name=service-customer
spring.profiles.active=dev
spring.main.allow-bean-definition-overriding=true
spring.cloud.nacos.discovery.server-addr=192.168.101.12:8848
spring.cloud.nacos.config.server-addr=192.168.101.12:8848
spring.cloud.nacos.config.prefix=${spring.application.name}
spring.cloud.nacos.config.file-extension=yaml
spring.cloud.nacos.config.shared-configs[0].data-id=common-account.yaml

spring.cloud.nacos.config.enable-remote-sync-config=true
spring.cloud.nacos.config.refresh-enabled=true
spring.cloud.nacos.config.max-retry=0